name: Terraform

# Plan on PRs (review gate); apply after a merge/push to a protected branch.
# The environment (dev/int/qa/prod) is derived from the branch, so each branch
# deploys with its own backend + tfvars. main defaults to dev.
on:
  pull_request:
    branches: [main, dev, int, qa, prod]
  push:
    branches: [main, dev, int, qa, prod]
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: af-south-1
  TF_IN_AUTOMATION: "true"
  # All Terraform config lives under project/
  WORKDIR: project

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        # PR → target branch (base_ref); push/dispatch → the branch itself.
        run: |
          ref="${{ github.base_ref || github.ref_name }}"
          case "$ref" in
            dev|int|qa|prod) env="$ref" ;;
            *)               env="dev" ;; # main and anything else → dev
          esac
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "Resolved environment '$env' from ref '$ref'"

  plan:
    name: Plan
    needs: resolve
    # PRs and manual runs only — not on push/merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      TF_ENV: ${{ needs.resolve.outputs.env }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          # Disable the output wrapper so the pseudo-TTY (and thus colour)
          # is preserved in the logs.
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend-config="values/${TF_ENV}/${TF_ENV}.tfbackend"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        # Run under a pseudo-TTY so Terraform emits ANSI colour, which the
        # Actions log renders: green create, red destroy, yellow update.
        run: script -qefc "terraform plan -input=false -var-file=values/${TF_ENV}/${TF_ENV}.tfvars -out=tfplan" /dev/null

      - name: Plan summary
        if: success()
        run: |
          {
            echo "### Terraform plan — ${TF_ENV}"
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        # Post the plan into the PR so it can be reviewed before merging.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "#### Terraform plan — \`${TF_ENV}\` 📖"
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```terraform'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } > plan_comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            -R "${{ github.repository }}" --body-file plan_comment.md

  apply:
    name: Apply
    needs: resolve
    # Runs after a merge/push to a protected branch, or a manual dispatch —
    # never on the PR itself. Tracked under the per-environment GitHub
    # Environment (add reviewers/secrets there to gate a specific env).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.env }}
    permissions:
      contents: read
    env:
      TF_ENV: ${{ needs.resolve.outputs.env }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="values/${TF_ENV}/${TF_ENV}.tfbackend"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply
        # Re-plans against the current state and applies, under a pseudo-TTY
        # for coloured output. Re-planning avoids stale saved-plan errors.
        run: script -qefc "terraform apply -input=false -auto-approve -var-file=values/${TF_ENV}/${TF_ENV}.tfvars" /dev/null
