name: Terraform

# Plan on PRs (review gate); apply after a merge/push to a protected branch.
# So merging the PR closes it AND triggers the gated deploy. Both jobs are
# also reachable via a manual run from the Actions tab.
on:
  pull_request:
    branches: [main, dev, int, qa, prod]
  push:
    branches: [main, dev, int, qa, prod]
  workflow_dispatch:

# Newer pushes to the same PR (or ref) cancel superseded runs.
concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: af-south-1
  TF_IN_AUTOMATION: "true"
  # All Terraform config lives under project/
  WORKDIR: project
  BACKEND_CONFIG: values/dev/dev.tfbackend

jobs:
  plan:
    name: Plan
    # PRs and manual runs only — not on push/merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          # Disable the output wrapper so the pseudo-TTY (and thus colour)
          # is preserved in the logs.
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend-config="${BACKEND_CONFIG}"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        # Run under a pseudo-TTY so Terraform emits ANSI colour, which the
        # Actions log renders: green create, red destroy, yellow update.
        run: script -qefc "terraform plan -input=false -out=tfplan" /dev/null

      - name: Plan summary
        if: success()
        run: |
          {
            echo "### Terraform plan"
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply (approval required)
    # Runs after a merge/push to a protected branch, or a manual dispatch —
    # never on the PR itself. The "aws-apply" environment gates it on a
    # required-reviewer approval before AWS is touched.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: aws-apply
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="${BACKEND_CONFIG}"

      - name: Terraform apply
        # Re-plans against the current state and applies, under a pseudo-TTY
        # for coloured output. Re-planning avoids stale saved-plan errors.
        run: script -qefc "terraform apply -input=false -auto-approve" /dev/null
